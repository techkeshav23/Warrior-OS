<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Warrior OS default pointer. Hotspot: 6 4 (the tip). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2332"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
  </defs>
  <!-- soft plasma halo -->
  <path d="M6 4 L6 21.6 L10.3 17.7 L13.2 24.3 L16 23.1 L13.1 16.6 L18.9 16.6 Z" fill="none" stroke="#2fd6f5" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- dark underlay keeps the edge readable on bright fills -->
  <path d="M6 4 L6 21.6 L10.3 17.7 L13.2 24.3 L16 23.1 L13.1 16.6 L18.9 16.6 Z" fill="#04060b" stroke="#04060b" stroke-opacity="0.85" stroke-width="3" stroke-linejoin="round"/>
  <!-- body + plasma rim -->
  <path d="M6 4 L6 21.6 L10.3 17.7 L13.2 24.3 L16 23.1 L13.1 16.6 L18.9 16.6 Z" fill="url(#body)" stroke="#2fd6f5" stroke-width="1.25" stroke-linejoin="round"/>
  <!-- inner edge highlight -->
  <path d="M7.4 7.6 L7.4 17.8" stroke="#7ce7fb" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round"/>
</svg>
