<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Warrior OS interactive reticle (links, buttons, menu items). Hotspot: 16 16. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round">
    <!-- soft plasma halo -->
    <g stroke="#2fd6f5" stroke-opacity="0.5" stroke-width="2" filter="url(#glow)">
      <circle cx="16" cy="16" r="6.5"/>
    </g>
    <!-- dark underlay keeps the reticle readable on bright fills -->
    <g stroke="#04060b" stroke-opacity="0.8" stroke-width="3.5">
      <circle cx="16" cy="16" r="6.5"/>
      <path d="M16 3.5 V8 M16 24 V28.5 M3.5 16 H8 M24 16 H28.5"/>
    </g>
    <!-- reticle -->
    <circle cx="16" cy="16" r="6.5" stroke="#2fd6f5" stroke-width="1.5"/>
    <path d="M16 3.5 V8 M16 24 V28.5 M3.5 16 H8 M24 16 H28.5" stroke="#7ce7fb" stroke-width="1.5"/>
  </g>
  <circle cx="16" cy="16" r="2.4" fill="#04060b" fill-opacity="0.85"/>
  <circle cx="16" cy="16" r="1.4" fill="#e6edf7"/>
</svg>
