<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Warrior OS busy cursor: the pointer plus a hex spinner badge. Hotspot: 6 4.
       (Cursor images are drawn static; the spinner turns where the SVG is shown as an image.) -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2332"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <path d="M6 4 L6 21.6 L10.3 17.7 L13.2 24.3 L16 23.1 L13.1 16.6 L18.9 16.6 Z" fill="none" stroke="#2fd6f5" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M6 4 L6 21.6 L10.3 17.7 L13.2 24.3 L16 23.1 L13.1 16.6 L18.9 16.6 Z" fill="#04060b" stroke="#04060b" stroke-opacity="0.85" stroke-width="3" stroke-linejoin="round"/>
  <path d="M6 4 L6 21.6 L10.3 17.7 L13.2 24.3 L16 23.1 L13.1 16.6 L18.9 16.6 Z" fill="url(#body)" stroke="#2fd6f5" stroke-width="1.25" stroke-linejoin="round"/>
  <!-- hex badge -->
  <polygon points="23.5,17 28.7,20 28.7,26 23.5,29 18.3,26 18.3,20" fill="#070a12" stroke="#04060b" stroke-opacity="0.85" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="23.5,17 28.7,20 28.7,26 23.5,29 18.3,26 18.3,20" fill="#070a12" stroke="#33415a" stroke-width="1.25" stroke-linejoin="round"/>
  <polygon points="23.5,17 28.7,20 28.7,26 23.5,29 18.3,26 18.3,20" fill="none" stroke="#2fd6f5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="11 25">
    <animateTransform attributeName="transform" type="rotate" from="0 23.5 23" to="360 23.5 23" dur="1.2s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="23.5" cy="23" r="1.3" fill="#7ce7fb"/>
</svg>
